[project]
name = "fleetguard"
version = "0.1.0"
description = "FleetGuard AI - predictive maintenance and fleet intelligence platform (simulated data)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pandera>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown docs are user-authored; do not reformat embedded Python blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
